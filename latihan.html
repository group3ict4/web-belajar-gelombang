<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Latihan Soal Bunyi</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: radial-gradient(circle at top, #0f2a3f, #020c14);
    color:#e8faff;
  }

  .top-bar{
    display:flex;
    justify-content:space-between;
    padding:16px 22px;
  }

  button{
    background:#00e5ff;
    border:none;
    padding:16px 28px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
  }

  #quizCard{
    width:90%;
    max-width:650px;
    margin:40px auto;
    background:#0b2436;
    padding:40px;
    border-radius:16px;
    box-shadow:0 0 25px rgba(0,255,255,0.25);
  }

  #number{
    color:#7defff;
    margin-bottom:10px;
    font-weight:bold;
  }

  .choice{
    border:1px solid #1bc6d4;
    padding:20px;
    border-radius:10px;
    margin-top:10px;
    cursor:pointer;
  }

  .choice:hover{
    background:#083548;
  }

  .correct{
    background:#0f6d4d;
    border-color:#00ffcc;
  }

  .wrong{
    background:#6d1f1f;
    border-color:#ff4d4d;
  }

  #explain{
    margin-top:15px;
    background:#0e1f2a;
    padding:12px;
    border-radius:10px;
    display:none;
  }

  .kunci{
    color:#ffd54f;
    font-weight:bold;
  }

  #nextBtn{
    margin-top:15px;
    display:none;
  }

  .result-badge{
    margin-top:10px;
    font-weight:bold;
  }

  #resultBox{
    display:none;
    text-align:center;
    margin-top:60px;
  }
</style>
</head>

<body>

<!-- BACKSOUND -->
<audio id="bgm" loop>
  <source src="backsound.mp3" type="audio/mpeg">
</audio>

<div class="top-bar">
  <button id="bgmToggle">🔇 Backsound: OFF</button>
  <button id="backSim">← Kembali</button>
</div>

<!-- QUIZ -->
<div id="quizCard">
  <div id="number"></div>
  <div id="question"></div>
  <div id="choices"></div>
  <div id="explain"></div>
  <button id="nextBtn">Soal Berikutnya →</button>
</div>

<!-- RESULT -->
<div id="resultBox">
  <h2>🎉 Latihan Selesai</h2>
  <p id="scoreVal"></p>
  <button id="toSimResult">Kembali ke Menu</button>
</div>

<!-- CONFETTI -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<!-- JS UTAMA -->
<script src="latihan.js"></script>

</body>
</html>
